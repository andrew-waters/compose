name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The package declares macOS 26 and the plugin links apple/container, which needs the
    # same SDK, so this has to be a Tahoe runner. The tests themselves need nothing: the
    # planner is a pure function and the parser reads strings, so no daemon runs here.
    runs-on: macos-26
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # `git describe` derives the version, so the tags have to come with the checkout.
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      # Only the checkouts are cached, not the build. Cloning apple/container and
      # containerization is the slow part; caching object files as well has a habit of
      # producing incremental builds that succeed on nothing but the cache.
      - name: Cache SwiftPM checkouts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .build/checkouts
            .build/repositories
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Swift version
        run: swift --version

      # Version.swift is stamped from the tag at build time, so the value in the repository
      # is a placeholder and has to stay one. A hand-edited version is a version that can
      # disagree with the tag it ships under, which is the thing this arrangement exists to
      # prevent, so it is worth failing a pull request over.
      - name: Check the version is not hand-edited
        run: |
          expected='let composeVersion = "0.0.0-dev"'
          if ! grep -qxF "$expected" Sources/compose/Version.swift; then
            echo "Sources/compose/Version.swift must hold the placeholder, not a version."
            echo "expected: $expected"
            echo "found:    $(grep '^let composeVersion' Sources/compose/Version.swift)"
            exit 1
          fi

      # Builds every target, the plugin included, and runs the library tests.
      - name: Test
        run: make test

      # The plugin is what people install, so build it the way it is shipped rather than
      # trusting that a debug build implies a release one. `make build` stamps the version in
      # and puts the working copy back afterwards.
      - name: Build the plugin
        run: make build

      # A plugin is a directory with a config file and a binary whose name matches it. If
      # that layout is wrong the CLI simply does not find the plugin, with no error worth
      # reading, so check it here rather than discovering it after an install.
      - name: Check the plugin layout
        run: |
          make install PREFIX="$RUNNER_TEMP/root"
          test -x "$RUNNER_TEMP/root/libexec/container-plugins/compose/bin/compose"
          test -f "$RUNNER_TEMP/root/libexec/container-plugins/compose/config.toml"
          "$RUNNER_TEMP/root/libexec/container-plugins/compose/bin/compose" --help

      # The build restores the placeholder, so a dirty tree here means something wrote to a
      # tracked file that it should not have.
      - name: Check the build left the tree alone
        run: git diff --exit-code

  release:
    # Only a tag is a release. The job publishes what `test` has already built the same way,
    # rather than being the first place the shipped layout is exercised.
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Cache SwiftPM checkouts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .build/checkouts
            .build/repositories
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build the plugin
        run: make build

      # `git describe` on a tagged commit returns the tag, so these can only disagree if the
      # checkout is not what the tag points at or the tree is dirty. Either way, shipping a
      # binary that reports a version other than the one on the box is worse than not
      # shipping, so stop here.
      - name: Check the binary reports the tag
        run: |
          reported=$(.build/release/compose --version)
          if [ "$reported" != "$GITHUB_REF_NAME" ]; then
            echo "tag is $GITHUB_REF_NAME but the binary reports $reported"
            exit 1
          fi
          echo "$reported"

      # Ship the plugin directory exactly as it is installed, so unpacking it into
      # libexec/container-plugins is the whole install.
      - name: Package the plugin
        run: |
          make install PREFIX="$RUNNER_TEMP/root"
          tar -czf "compose-$GITHUB_REF_NAME-macos-arm64.tar.gz" \
            -C "$RUNNER_TEMP/root/libexec/container-plugins" compose

      # The tag message is the release title. Tags here carry a one-line summary written for
      # a human, which is a better headline than the commit subject underneath it.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
          gh release create "$GITHUB_REF_NAME" \
            --title "${title:-$GITHUB_REF_NAME}" \
            --generate-notes \
            "compose-$GITHUB_REF_NAME-macos-arm64.tar.gz"
