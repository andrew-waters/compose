name: CI

# A run is a macOS runner for a long while, so nothing runs for a change that cannot affect the
# build: the harness's own documents, Gannin's session commits, the site and Markdown. The list
# appears twice here and once more in the release job's check below; keep all three in step.
# Path filters never apply to tags, so a release always runs.
on:
  pull_request:
    paths-ignore:
      - "sessions/**"
      - "plans/**"
      - "requirements/**"
      - "findings/**"
      - "prompts/**"
      - ".gannin/**"
      - ".claude/**"
      - "site/**"
      - "**/*.md"
  push:
    branches: [main]
    tags: ["*"]
    paths-ignore:
      - "sessions/**"
      - "plans/**"
      - "requirements/**"
      - "findings/**"
      - "prompts/**"
      - ".gannin/**"
      - ".claude/**"
      - "site/**"
      - "**/*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The package declares macOS 26 and the plugin links apple/container, which needs the
    # same SDK, so this has to be a Tahoe runner. The tests themselves need nothing: the
    # planner is a pure function and the parser reads strings, so no daemon runs here.
    # A tag points at a commit main has already tested, so a release does not test it again.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-26
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # `git describe` derives the version, so the tags have to come with the checkout.
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      # Only the checkouts are cached, not the build. Cloning apple/container and
      # containerization is the slow part; caching object files as well has a habit of
      # producing incremental builds that succeed on nothing but the cache.
      - name: Cache SwiftPM checkouts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .build/checkouts
            .build/repositories
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Swift version
        run: swift --version

      # Version.swift is stamped from the tag at build time, so the value in the repository
      # is a placeholder and has to stay one. A hand-edited version is a version that can
      # disagree with the tag it ships under, which is the thing this arrangement exists to
      # prevent, so it is worth failing a pull request over.
      - name: Check the version is not hand-edited
        run: |
          expected='let composeVersion = "0.0.0-dev"'
          if ! grep -qxF "$expected" Sources/compose/Version.swift; then
            echo "Sources/compose/Version.swift must hold the placeholder, not a version."
            echo "expected: $expected"
            echo "found:    $(grep '^let composeVersion' Sources/compose/Version.swift)"
            exit 1
          fi

      # Builds every target, the plugin included, and runs the library tests.
      - name: Test
        run: make test

      # The plugin is what people install, so build it the way it is shipped rather than
      # trusting that a debug build implies a release one. `make build` stamps the version in
      # and puts the working copy back afterwards.
      - name: Build the plugin
        run: make build

      # A plugin is a directory with a config file and a binary whose name matches it. If
      # that layout is wrong the CLI simply does not find the plugin, with no error worth
      # reading, so check it here rather than discovering it after an install.
      - name: Check the plugin layout
        run: |
          make install PREFIX="$RUNNER_TEMP/root"
          test -x "$RUNNER_TEMP/root/libexec/container-plugins/compose/bin/compose"
          test -f "$RUNNER_TEMP/root/libexec/container-plugins/compose/config.toml"
          "$RUNNER_TEMP/root/libexec/container-plugins/compose/bin/compose" --help

      # The build restores the placeholder, so a dirty tree here means something wrote to a
      # tracked file that it should not have.
      - name: Check the build left the tree alone
        run: git diff --exit-code

  release:
    # Only a tag is a release. It ships what main has already tested and built the same way,
    # rather than being the first place the shipped layout is exercised, and checks that
    # rather than running the tests a second time.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-26
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Cache SwiftPM checkouts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .build/checkouts
            .build/repositories
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      # The tagged commit itself may never have had a run: a commit that only touches ignored
      # paths does not get one. So find the newest commit on main that passed and that the tag
      # contains, and require that nothing CI would have tested has changed since. A tag on a
      # commit whose run failed, or is still going, stops here.
      - name: Check main passed CI on what is being released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tested=""
          for sha in $(gh run list --workflow CI --branch main --event push --status success \
              --limit 50 --json headSha --jq '.[].headSha'); do
            if git merge-base --is-ancestor "$sha" "$GITHUB_SHA"; then tested=$sha; break; fi
          done
          if [ -z "$tested" ]; then
            echo "no passing CI run on main for $GITHUB_SHA or anything before it"
            exit 1
          fi
          if ! git diff --quiet "$tested" "$GITHUB_SHA" -- . \
              ':(exclude,glob)sessions/**' ':(exclude,glob)plans/**' \
              ':(exclude,glob)requirements/**' ':(exclude,glob)findings/**' \
              ':(exclude,glob)prompts/**' ':(exclude,glob).gannin/**' \
              ':(exclude,glob).claude/**' ':(exclude,glob)site/**' ':(exclude,glob)**/*.md'; then
            echo "main last passed CI at $tested, and code has changed since then:"
            git diff --stat "$tested" "$GITHUB_SHA"
            echo "wait for CI on main to pass, then tag again"
            exit 1
          fi
          echo "releasing what CI tested at $tested"

      - name: Build the plugin
        run: make build

      # `git describe` on a tagged commit returns the tag, so these can only disagree if the
      # checkout is not what the tag points at or the tree is dirty. Either way, shipping a
      # binary that reports a version other than the one on the box is worse than not
      # shipping, so stop here.
      - name: Check the binary reports the tag
        run: |
          reported=$(.build/release/compose --version)
          if [ "$reported" != "$GITHUB_REF_NAME" ]; then
            echo "tag is $GITHUB_REF_NAME but the binary reports $reported"
            exit 1
          fi
          echo "$reported"

      # Ship the plugin directory exactly as it is installed, so unpacking it into
      # libexec/container-plugins is the whole install.
      - name: Package the plugin
        run: |
          make install PREFIX="$RUNNER_TEMP/root"
          tar -czf "compose-$GITHUB_REF_NAME-macos-arm64.tar.gz" \
            -C "$RUNNER_TEMP/root/libexec/container-plugins" compose

      # The tag message is the release title. Tags here carry a one-line summary written for
      # a human, which is a better headline than the commit subject underneath it.
      #
      # Read it from the API rather than from git. actions/checkout materialises a tag as a
      # lightweight ref pointing straight at the commit, so `git tag -l` with
      # `%(contents:subject)` finds no annotation and quietly falls back to the commit
      # subject. That is how 0.3.0 came out titled after a merge commit. The API answers with
      # the tag object however the local ref was made, and says so when there is not one.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title=""
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type')" = "tag" ]; then
            sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha')
            title=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.message' | head -1)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "${title:-$GITHUB_REF_NAME}" \
            --generate-notes \
            "compose-$GITHUB_REF_NAME-macos-arm64.tar.gz"
