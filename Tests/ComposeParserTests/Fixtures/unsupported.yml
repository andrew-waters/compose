services:
  app:
    image: app:latest
    restart: always
    user: "1000:1000"
    entrypoint: /bin/sh
    pull_policy: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
    privileged: true
    ports:
      - "3000"
    volumes:
      - appdata:/data
    labels:
      - role=app
    typo_key: 1

volumes:
  appdata: {}
